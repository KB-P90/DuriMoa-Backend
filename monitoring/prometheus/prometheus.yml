global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: spring-monitoring-production
    scheme: https
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["durimoa.kro.kr"]
