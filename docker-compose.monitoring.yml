name: durimoa-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load-test"]
    depends_on:
      - prometheus
    environment:
      BASE_URL: ${BASE_URL:-https://durimoa.kro.kr}
      API_PATH: ${API_PATH:-/v2/api-docs}
      ACCESS_TOKEN: ${ACCESS_TOKEN:-}
      LOGIN_PHONE: ${LOGIN_PHONE:-}
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      LOAD_TEST_ACCOUNT_COUNT: ${LOAD_TEST_ACCOUNT_COUNT:-}
      LOAD_TEST_PHONE_PREFIX: ${LOAD_TEST_PHONE_PREFIX:-010-9900-}
      LOAD_TEST_PASSWORD: ${LOAD_TEST_PASSWORD:-}
      TEST_VUS: ${K6_VUS:-10}
      TEST_DURATION: ${K6_DURATION:-30s}
      TEST_ITERATIONS: ${K6_ITERATIONS:-1}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(90),p(95),p(99),max
      K6_TEST_RUN_ID: ${K6_TEST_RUN_ID:-local}
    volumes:
      - ./monitoring/k6:/scripts:ro
    command: run -o experimental-prometheus-rw /scripts/load-test.js

volumes:
  prometheus-data:
  grafana-data:
